<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1628" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bütçem" />
  <title>Aile Bütçem</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <p id="boot" class="boot">Yükleniyor…</p>

  <form id="login" class="login" hidden>
    <h1>Aile Bütçem</h1>
    <p>Hesabınla giriş yap. Bu cihazda bir kez yeterli.</p>
    <label class="field"><span>E-posta</span><input name="email" type="email" autocomplete="username" required /></label>
    <label class="field"><span>Şifre</span><input name="password" type="password" autocomplete="current-password" required /></label>
    <p id="login-error" class="error" role="alert"></p>
    <button class="primary wide">Giriş yap</button>
  </form>

  <div id="app" hidden>
    <header id="top" class="top"></header>
    <main id="view"></main>
    <nav class="tabs" aria-label="Bölümler">
      <button data-tab="month">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        Bu ay
      </button>
      <button data-tab="history">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
        Geçmiş
      </button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
